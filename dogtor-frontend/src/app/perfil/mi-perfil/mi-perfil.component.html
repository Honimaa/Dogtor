<app-navegacion></app-navegacion>

<div class="main panel-main">
  <div class="dt-page perfil-page">
    <div class="dt-page-header">
      <div>
        <span class="dt-eyebrow">Cuenta</span>
        <h1>{{ titulo }}</h1>
        <p class="dt-lead">Actualiza tu foto y tus datos de contacto.</p>
      </div>
    </div>

    <div class="dt-empty" *ngIf="cargando">Cargando tu perfil…</div>

    <form *ngIf="perfil" class="dt-card perfil-card" (ngSubmit)="guardar()">
      <div class="foto-zona">
        <div class="foto-wrap">
          <img [src]="fotoNueva || perfil.foto" [alt]="'Foto de ' + perfil.nombre" />
          <label class="cambiar-foto" title="Cambiar foto">
            <ion-icon name="camera-outline"></ion-icon>
            <input type="file" accept="image/*" (change)="elegirFoto($event)" hidden />
          </label>
        </div>
        <div>
          <h3>{{ perfil.nombre }}</h3>
          <p class="usuario">&#64;{{ perfil.usuario }} · {{ perfil.tipo === 'Veterinario' ? 'Doctor' : (perfil.tipo === 'Admin' ? 'Administrador' : 'Propietario') }}</p>
          <span class="dt-badge dt-badge-gold" *ngIf="fotoNueva">Foto nueva sin guardar</span>
        </div>
      </div>

      <div class="grid-2">
        <div class="dt-field">
          <label for="nombre">Nombre completo</label>
          <input id="nombre" name="nombre" [(ngModel)]="form.nombre" required />
        </div>
        <div class="dt-field">
          <label for="cedula">Cédula</label>
          <input id="cedula" name="cedula" [value]="perfil.cedula || ''" disabled />
        </div>

        <ng-container *ngIf="perfil.tipo !== 'Veterinario'">
          <div class="dt-field">
            <label for="correo">Correo electrónico</label>
            <input id="correo" name="correo" type="email" [(ngModel)]="form.correo" />
          </div>
        </ng-container>

        <div class="dt-field" *ngIf="perfil.tipo === 'Cliente'">
          <label for="celular">Celular</label>
          <input id="celular" name="celular" type="tel" [(ngModel)]="form.celular" />
        </div>

        <ng-container *ngIf="perfil.tipo === 'Veterinario'">
          <div class="dt-field">
            <label for="especialidad">Especialidad</label>
            <input id="especialidad" name="especialidad" [(ngModel)]="form.especialidad" />
          </div>
          <div class="dt-field">
            <label for="horario">Turno de atención</label>
            <input id="horario" name="horario" [(ngModel)]="form.horario" placeholder="Ej.: Lun a Vie · 8:00 a 17:00" />
          </div>
          <div class="dt-field">
            <label for="sede">Sede</label>
            <input id="sede" name="sede" [value]="perfil.sede || ''" disabled />
          </div>
        </ng-container>
      </div>

      <label class="check-contrasena">
        <input type="checkbox" name="cambiar" [(ngModel)]="cambiarContrasena" /> Cambiar mi contraseña
      </label>
      <div class="grid-3" *ngIf="cambiarContrasena">
        <div class="dt-field">
          <label for="actual">Contraseña actual</label>
          <input id="actual" name="actual" type="password" autocomplete="current-password" [(ngModel)]="form.contrasenaActual" />
        </div>
        <div class="dt-field">
          <label for="nueva">Nueva contraseña</label>
          <input id="nueva" name="nueva" type="password" autocomplete="new-password" [(ngModel)]="form.contrasenaNueva" />
        </div>
        <div class="dt-field">
          <label for="confirmar">Confirmar nueva</label>
          <input id="confirmar" name="confirmar" type="password" autocomplete="new-password" [(ngModel)]="confirmacion" />
        </div>
      </div>

      <div class="acciones">
        <button type="submit" class="dt-btn" [disabled]="guardando">
          <ion-icon name="save-outline"></ion-icon> {{ guardando ? 'Guardando…' : 'Guardar cambios' }}
        </button>
      </div>
    </form>
  </div>
</div>
