<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400" role="img" aria-label="Gato snowshoe animado">
  <style>
    .cola { transform-origin: 262px 318px; animation: cola 2.6s ease-in-out infinite; }
    .parpado { transform-box: fill-box; transform-origin: center; animation: parpadeo 4.5s infinite; }
    .oreja-der { transform-origin: 236px 112px; animation: oreja 5s ease-in-out infinite; }
    .cuerpo { transform-origin: 200px 360px; animation: respirar 3.2s ease-in-out infinite; }
    .sombra { transform-origin: 200px 368px; animation: sombra 3.2s ease-in-out infinite; }
    @keyframes cola { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(-16deg); } }
    @keyframes parpadeo { 0%, 92%, 100% { transform: scaleY(0); } 95% { transform: scaleY(1); } }
    @keyframes oreja { 0%, 80%, 100% { transform: rotate(0deg); } 84% { transform: rotate(-10deg); } 88% { transform: rotate(4deg); } }
    @keyframes respirar { 0%, 100% { transform: scale(1, 1); } 50% { transform: scale(1.012, 1.02); } }
    @keyframes sombra { 0%, 100% { transform: scaleX(1); } 50% { transform: scaleX(1.03); } }
  </style>

  <!-- Sombra -->
  <ellipse class="sombra" cx="200" cy="368" rx="110" ry="12" fill="#2a4e68" opacity="0.12"/>

  <!-- Cola (detrás del cuerpo) -->
  <g class="cola">
    <path d="M262 318 C 320 318, 345 290, 338 240 C 334 214, 352 196, 368 206"
          fill="none" stroke="#8a6a55" stroke-width="22" stroke-linecap="round"/>
    <path d="M352 205 C 360 199, 368 202, 370 208" fill="none" stroke="#5a4033" stroke-width="22" stroke-linecap="round"/>
  </g>

  <g class="cuerpo">
    <!-- Cuerpo sentado -->
    <path d="M140 360 C 128 300, 140 232, 200 214 C 260 232, 272 300, 262 360 Z" fill="#f3e6d3"/>
    <path d="M168 240 C 186 228, 214 228, 232 240 C 226 290, 174 290, 168 240 Z" fill="#fffaf2"/>
    <!-- Patas delanteras blancas (rasgo del snowshoe) -->
    <rect x="164" y="300" width="28" height="62" rx="14" fill="#f3e6d3"/>
    <rect x="208" y="300" width="28" height="62" rx="14" fill="#f3e6d3"/>
    <ellipse cx="178" cy="358" rx="17" ry="10" fill="#ffffff"/>
    <ellipse cx="222" cy="358" rx="17" ry="10" fill="#ffffff"/>

    <!-- Cabeza -->
    <g>
      <!-- Orejas -->
      <path d="M138 128 L 150 62 L 192 104 Z" fill="#6b4c3b"/>
      <path d="M150 116 L 156 80 L 180 104 Z" fill="#e8b4a8"/>
      <g class="oreja-der">
        <path d="M262 128 L 250 62 L 208 104 Z" fill="#6b4c3b"/>
        <path d="M250 116 L 244 80 L 220 104 Z" fill="#e8b4a8"/>
      </g>
      <ellipse cx="200" cy="150" rx="74" ry="64" fill="#f3e6d3"/>
      <!-- Máscara oscura con la "V" blanca invertida del snowshoe -->
      <path d="M150 128 C 166 104, 234 104, 250 128 C 252 168, 228 196, 200 198 C 172 196, 148 168, 150 128 Z" fill="#8a6a55"/>
      <path d="M200 130 L 178 196 C 186 202, 214 202, 222 196 Z" fill="#ffffff"/>
      <!-- Ojos azules -->
      <ellipse cx="174" cy="146" rx="13" ry="14" fill="#ffffff"/>
      <ellipse cx="226" cy="146" rx="13" ry="14" fill="#ffffff"/>
      <ellipse cx="174" cy="147" rx="9" ry="11" fill="#5cadf4"/>
      <ellipse cx="226" cy="147" rx="9" ry="11" fill="#5cadf4"/>
      <ellipse cx="174" cy="148" rx="3.5" ry="8" fill="#12293a"/>
      <ellipse cx="226" cy="148" rx="3.5" ry="8" fill="#12293a"/>
      <circle cx="177" cy="142" r="2.5" fill="#ffffff"/>
      <circle cx="229" cy="142" r="2.5" fill="#ffffff"/>
      <!-- Párpados (parpadeo) -->
      <ellipse class="parpado" cx="174" cy="146" rx="14" ry="15" fill="#8a6a55"/>
      <ellipse class="parpado" cx="226" cy="146" rx="14" ry="15" fill="#8a6a55"/>
      <!-- Nariz y boca -->
      <path d="M193 170 L 207 170 L 200 178 Z" fill="#e88f9a"/>
      <path d="M200 178 C 200 186, 190 188, 186 184 M200 178 C 200 186, 210 188, 214 184"
            fill="none" stroke="#5a4033" stroke-width="2.5" stroke-linecap="round"/>
      <!-- Bigotes -->
      <g stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.9">
        <path d="M184 178 L 140 172"/><path d="M184 182 L 142 186"/>
        <path d="M216 178 L 260 172"/><path d="M216 182 L 258 186"/>
      </g>
    </g>

    <!-- Collar Dogtor -->
    <path d="M152 208 C 176 222, 224 222, 248 208" fill="none" stroke="#1d95db" stroke-width="10" stroke-linecap="round"/>
    <circle cx="200" cy="224" r="9" fill="#e2b979" stroke="#c99a52" stroke-width="2"/>
  </g>
</svg>
