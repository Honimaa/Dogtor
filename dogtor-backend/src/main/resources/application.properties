#---
# MySQL: java -jar target/dogtor-0.0.1-SNAPSHOT.jar --spring.profiles.active=mysql
# Usuario y contraseña por variables de entorno DB_USER y DB_PASSWORD (por defecto root / vacía)
spring.config.activate.on-profile=mysql
server.port=8082
spring.application.name=dogtor
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.check-template-location=true
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:dogtor}?createDatabaseIfNotExist=true&serverTimezone=America/Bogota&useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.mvc.hiddenmethod.filter.enabled=true
server.error.include-message=always

#---
# Genera database/schema-mysql.sql a partir de las entidades, sin conectarse a MySQL:
# java -jar target/dogtor-0.0.1-SNAPSHOT.jar --spring.profiles.active=ddl
spring.config.activate.on-profile=ddl
spring.main.web-application-type=none
spring.datasource.url=jdbc:h2:mem:ddl;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.jakarta.persistence.schema-generation.scripts.action=create
spring.jpa.properties.jakarta.persistence.schema-generation.scripts.create-target=database/schema-mysql.sql
spring.jpa.properties.hibernate.hbm2ddl.delimiter=;
spring.jpa.properties.hibernate.format_sql=true
dogtor.datos-ejemplo=false
